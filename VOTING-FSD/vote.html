<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System</title>
    <link rel="stylesheet" href="votestyle.css">
</head>
<body>

<div class="container">

    <h1>Voting System</h1>

    <div class="candidate">

        <h2>Candidate A</h2>

        <h3 class="vote-a">0</h3>

        <button class="btn-a">
            Vote
        </button>

    </div>

    <div class="candidate">

        <h2>Candidate B</h2>

        <h3 class="vote-b">0</h3>

        <button class="btn-b">
            Vote
        </button>

    </div>

    <h2 class="winner">
        No Winner Yet
    </h2>

    <button class="reset-btn">
        Reset Election
    </button>

</div>

<script src="votescript.js"></script>

</body>
</html>
