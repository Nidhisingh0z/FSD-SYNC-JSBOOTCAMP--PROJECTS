<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="calcstyle.css">
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>
        <input type="number" class="num1" placeholder="Enter First Number">
        <input type="number" class="num2" placeholder="Enter Second Number">
        <div class="buttons">
            <button class="add">+</button>
            <button class="subtract">-</button>
            <button class="multiply">*</button>
            <button class="divide">/</button>
        </div>
        <h2>Result : <span class="result">0</span></h2>
    </div>
    <script src="calcscript.js"></script>
</body>
</html>
